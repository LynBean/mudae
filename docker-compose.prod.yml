name: mudae

services:
  api:
    container_name: mudae-api
    image: ${DOCKER_IMAGE_URL}/api:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: api
      dockerfile: Dockerfile.prod

    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5000/health'', timeout=5).read()"',
        ]
      timeout: 20s
      interval: 20s
      retries: 2
    networks:
      - mudae
    restart: always
    environment:
      DISCORD_MUDAE_BOT_PREFIX: ${DISCORD_MUDAE_BOT_PREFIX}
      DISCORD_MUDAE_CHANNEL_IDS: ${DISCORD_MUDAE_CHANNEL_IDS}
      DISCORD_MUDAE_OWNER_IDS: ${DISCORD_MUDAE_OWNER_IDS}
      DISCORD_MUDAE_SELFBOT_PREFIX: ${DISCORD_MUDAE_SELFBOT_PREFIX}
      DISCORD_MUDAE_SELFBOT_TOKENS: ${DISCORD_MUDAE_SELFBOT_TOKENS}
      DISCORD_WATCHDOG_BOT_TOKEN: ${DISCORD_WATCHDOG_BOT_TOKEN}
      DISCORD_WATCHDOG_CHANNEL_ID: ${DISCORD_WATCHDOG_CHANNEL_ID}
      REDIS_URL: redis://redis:6379

  redis:
    container_name: mudae-redis
    image: redis/redis-stack-server:latest
    networks:
      - mudae
    restart: always

networks:
  mudae:
