      #             content = f.read()
      #         for key, value in env_vars.items():
      #             content = content.replace(f'os.environ[\"{key}\"]', repr(value))
      #         with open(filepath, 'w') as f:
      #             f.write(content)
      #     "

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_URL }}/api:latest

      - name: Stop cloud server
        env:
          DOCKER_HOST: ${{ vars.TAILSCALE_TARGET_HOST }}
        run: |
          docker compose -f docker-compose.prod.yml stop

      - name: Deploy to cloud
        env:
          DOCKER_HOST: ${{ vars.TAILSCALE_TARGET_HOST }}
          DOCKER_IMAGE_TAG: latest
          DOCKER_IMAGE_URL: ${{ vars.DOCKER_IMAGE_URL }}
          DISCORD_MUDAE_BOT_PREFIX: ${{ vars.DISCORD_MUDAE_BOT_PREFIX }}
          DISCORD_MUDAE_CHANNEL_IDS: ${{ secrets.DISCORD_MUDAE_CHANNEL_IDS }}
          DISCORD_MUDAE_OWNER_IDS: ${{ secrets.DISCORD_MUDAE_OWNER_IDS }}
          DISCORD_MUDAE_SELFBOT_PREFIX: ${{ vars.DISCORD_MUDAE_SELFBOT_PREFIX }}
          DISCORD_MUDAE_SELFBOT_TOKENS: ${{ secrets.DISCORD_MUDAE_SELFBOT_TOKENS }}
          DISCORD_WATCHDOG_BOT_TOKEN: ${{ secrets.DISCORD_WATCHDOG_BOT_TOKEN }}
          DISCORD_WATCHDOG_CHANNEL_ID: ${{ secrets.DISCORD_WATCHDOG_CHANNEL_ID }}
        run: |
          docker logout ghcr.io
          echo ${{ secrets.DOCKER_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker logout ghcr.io
