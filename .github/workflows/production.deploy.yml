name: Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-compose-action@v1

      - uses: oven-sh/setup-bun@v2

      - name: Generate API config
        env:
          ENV: production
          REDIS_URL: redis://redis:6379
          DISCORD_WATCHDOG_BOT_TOKEN: ${{ secrets.DISCORD_WATCHDOG_BOT_TOKEN }}
          DISCORD_MUDAE_OWNER_IDS: ${{ secrets.DISCORD_MUDAE_OWNER_IDS }}
          DISCORD_WATCHDOG_CHANNEL_ID: ${{ secrets.DISCORD_WATCHDOG_CHANNEL_ID }}
          DISCORD_MUDAE_SELFBOT_PREFIX: ${{ vars.DISCORD_MUDAE_SELFBOT_PREFIX }}
          DISCORD_MUDAE_BOT_PREFIX: ${{ vars.DISCORD_MUDAE_BOT_PREFIX }}
          DISCORD_MUDAE_CHANNEL_IDS: ${{ secrets.DISCORD_MUDAE_CHANNEL_IDS }}
          DISCORD_MUDAE_SELFBOT_TOKENS: ${{ secrets.DISCORD_MUDAE_SELFBOT_TOKENS }}
        run: |
          cd api
          python scripts/write_config.py

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_URL }}/api:latest

      - name: Stop cloud server
        env:
          DOCKER_HOST: ${{ vars.TAILSCALE_TARGET_HOST }}
        run: |
          docker compose -f docker-compose.prod.yml stop

      - name: Deploy to cloud
        env:
          DOCKER_HOST: ${{ vars.TAILSCALE_TARGET_HOST }}
          DOCKER_IMAGE_TAG: latest
          DOCKER_IMAGE_URL: ${{ vars.DOCKER_IMAGE_URL }}
        run: |
          docker logout ghcr.io
          echo ${{ secrets.DOCKER_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker logout ghcr.io
